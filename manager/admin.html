<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSH 管理台</title>
<style>
  :root{
    --bg:#f4f6fb; --panel:#ffffff; --panel2:#f8fafc; --line:#e5e9f2;
    --txt:#1f2733; --mut:#6b7686; --acc:#4f46e5; --acc2:#4338ca; --acc-soft:#eef2ff;
    --ok:#16a34a; --ok-bg:#e8f7ee;
    --warn:#d97706; --warn-bg:#fdf3e3;
    --err:#dc2626; --err-bg:#fdeaea;
    --act:#4f46e5; --act-bg:#eef2ff;
    --radius:14px;
    --shadow:0 1px 2px rgba(16,24,40,.04), 0 8px 24px rgba(16,24,40,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg);color:var(--txt);
    font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;
    padding:32px 20px 48px;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:900px;margin:0 auto}
  /* 头部 */
  .head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}
  .brand{display:flex;align-items:center;gap:12px;min-width:0}
  .brand-mark{
    flex-shrink:0;width:38px;height:38px;border-radius:11px;color:#fff;
    background:linear-gradient(135deg,#6366f1,#8b5cf6);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 12px rgba(99,102,241,.35);
  }
  .head-txt h1{font-size:20px;font-weight:700;letter-spacing:-.01em;margin-bottom:2px}
  .head-txt .sub{color:var(--mut);font-size:13px}
  #btnLang{
    flex-shrink:0;background:#fff;border:1px solid var(--line);color:var(--txt);
    border-radius:999px;padding:7px 18px;font-size:13px;font-weight:600;cursor:pointer;
    box-shadow:0 1px 2px rgba(16,24,40,.04);transition:border-color .15s ease,color .15s ease;
  }
  #btnLang:hover{border-color:var(--acc);color:var(--acc)}
  /* 卡片 */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;margin-bottom:18px;box-shadow:var(--shadow)}
  .card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
  .card h2{font-size:15px;font-weight:650;letter-spacing:-.01em}
  /* 状态徽章 */
  .badge{display:inline-flex;align-items:center;gap:6px;padding:3px 12px;border-radius:999px;font-size:12px;font-weight:600}
  .badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
  .badge.ok{background:var(--ok-bg);color:var(--ok)}
  .badge.warn{background:var(--warn-bg);color:var(--warn)}
  .badge.err{background:var(--err-bg);color:var(--err)}
  .badge.act{background:var(--act-bg);color:var(--act)}
  /* 状态统计网格 */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .stat{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .stat-label{font-size:12px;color:var(--mut);margin-bottom:6px}
  .stat-value{font-size:15px;font-weight:600;word-break:break-all}
  .card-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
  /* 表单 */
  label{color:var(--mut);font-size:13px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  input[type=text],select{
    flex:1;min-width:220px;background:var(--panel2);border:1px solid var(--line);color:var(--txt);
    border-radius:10px;padding:9px 12px;font-size:13px;outline:none;
    transition:border-color .15s ease,box-shadow .15s ease;
  }
  input[type=text]:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
  /* 按钮 */
  button{
    background:var(--acc);border:none;color:#fff;border-radius:10px;padding:9px 18px;
    font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .15s ease;
  }
  button:hover{background:var(--acc2)}
  button:disabled{opacity:.5;cursor:not-allowed}
  button.ghost{background:#fff;border:1px solid var(--line);color:var(--mut)}
  button.ghost:hover{color:var(--txt);border-color:var(--mut);background:var(--panel2)}
  button.danger{background:var(--err-bg);color:var(--err);border:1px solid #f3c6c6}
  button.danger:hover{background:#fbd5d5}
  .hint{font-size:12px;color:var(--mut);margin-top:8px;line-height:1.7}
  .hint code{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px;color:var(--txt)}
  /* 日志 */
  .log{
    background:#0f1524;border:1px solid #1c2537;border-radius:12px;padding:12px 14px;
    font:12px/1.6 ui-monospace,SFMono-Regular,Consolas,Menlo,monospace;color:#b8c7e0;
    height:260px;overflow:auto;white-space:pre-wrap;word-break:break-all;
  }
  .log .err{color:var(--err)}
  /* 容器终端 */
  container-terminal{display:block}
  .terminal-panel{display:flex;flex-direction:column;gap:10px}
  .terminal-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .terminal-cwd-label{color:var(--mut);font-size:12px}
  .terminal-cwd{
    flex:1;min-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    color:var(--txt);font:12px ui-monospace,SFMono-Regular,Consolas,Menlo,monospace;
  }
  .terminal-output{
    height:320px;overflow:auto;margin:0;padding:14px 16px;background:#0b1220;
    border:1px solid #1c2a40;border-radius:10px;color:#d7e2f2;
    font:13px/1.55 ui-monospace,SFMono-Regular,Consolas,Menlo,monospace;
    white-space:pre-wrap;word-break:break-word;tab-size:2;
  }
  .terminal-input-row{display:flex;align-items:center;gap:8px}
  .terminal-prompt{color:var(--acc);font:600 14px ui-monospace,SFMono-Regular,Consolas,Menlo,monospace}
  .terminal-input{
    flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);color:var(--txt);
    border-radius:10px;padding:9px 12px;font:13px ui-monospace,SFMono-Regular,Consolas,Menlo,monospace;outline:none;
  }
  .terminal-input:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
  .terminal-hint{margin-top:0}
  @media (max-width:720px){
    .terminal-output{height:260px}
    .terminal-input-row{align-items:stretch}
    .terminal-input-row button{padding-left:13px;padding-right:13px}
  }
  /* 其他 */
  a.back{color:var(--acc);text-decoration:none;font-weight:600}
  a.back:hover{text-decoration:underline}
  .mt{margin-top:12px}
  .tag{display:inline-block;background:var(--acc-soft);color:var(--acc);border-radius:6px;padding:0 8px;font-size:12px;font-weight:600;margin-left:4px}
  @media (max-width:720px){
    .head{flex-direction:column;align-items:flex-start}
    .stats{grid-template-columns:repeat(2,1fr)}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="brand">
      <div class="brand-mark">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
      </div>
      <div class="head-txt">
        <h1 data-i18n="title">DeepSeek Harness 管理台</h1>
        <div class="sub" data-i18n="sub">管理员变体镜像 · 在此选择/切换 DSH 版本、配置 npm 源并管理 DSH 进程</div>
      </div>
    </div>
    <button id="btnLang" type="button">EN</button>
  </div>

  <div class="card">
    <div class="card-head">
      <h2 data-i18n="stTitle">运行状态</h2>
      <span id="stBadge" class="badge warn" data-i18n="stChecking">检测中</span>
    </div>
    <div class="stats">
      <div class="stat">
        <div class="stat-label" data-i18n="stLabelCur">当前版本</div>
        <div class="stat-value"><span id="stActual">-</span> <span id="stRequested" class="tag"></span></div>
      </div>
      <div class="stat">
        <div class="stat-label" data-i18n="stLabelTime">安装时间</div>
        <div class="stat-value" id="stInstalledAt">-</div>
      </div>
      <div class="stat">
        <div class="stat-label" data-i18n="stLabelRun">运行状态</div>
        <div class="stat-value" id="stRunning">-</div>
      </div>
      <div class="stat">
        <div class="stat-label" data-i18n="stLabelUi">DSH 界面</div>
        <div class="stat-value"><a class="back" href="/" id="linkDash" data-i18n="stOpenUi">打开 DSH 界面 ↗</a></div>
      </div>
    </div>
    <div class="card-actions">
      <button id="btnRestart" class="ghost" data-i18n="btnRestart">重启 DSH</button>
      <button id="btnRefresh" class="ghost" data-i18n="btnRefresh">刷新状态</button>
    </div>
  </div>

  <div class="card">
    <div class="card-head"><h2 data-i18n="regTitle">npm 源（NPM_CONFIG_REGISTRY）</h2></div>
    <div class="row">
      <input type="text" id="regInput" placeholder="加载中..." spellcheck="false" autocomplete="off" data-i18n-ph="regPlaceholder">
      <button id="btnRegUseDef" data-i18n="btnRegUseDef">使用默认值</button>
      <button id="btnRegSave" data-i18n="btnRegSave">保存</button>
    </div>
    <div class="hint" id="regHint" data-i18n="regHintLoading">加载中...</div>
  </div>

  <div class="card">
    <div class="card-head"><h2 data-i18n="verTitle">DSH 版本</h2></div>
    <div class="row">
      <select id="verSelect"><option data-i18n="verLoading">加载版本列表中...</option></select>
      <button id="btnInstall" data-i18n="btnInstall">安装 / 切换版本</button>
      <button id="btnRefreshVer" class="ghost" data-i18n="btnRefreshVer">刷新列表</button>
    </div>
    <div class="hint" data-i18n="verHint">安装或切换后会自动启动 DSH。</div>
  </div>

  <div class="card">
    <div class="card-head">
      <h2 data-i18n="terminalTitle">容器终端</h2>
      <span id="terminalStatus" class="badge warn" data-i18n="terminalConnecting">连接中</span>
    </div>
    <container-terminal id="containerTerminal"></container-terminal>
  </div>

  <div class="card">
    <div class="card-head">
      <h2 data-i18n="logTitle">安装日志（实时）</h2>
      <button id="btnClearLog" class="ghost" data-i18n="btnClearLog">清空</button>
    </div>
    <div class="log" id="log"></div>
  </div>
</div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };

  // ── 中英文翻译 ─────────────────────────────────────────────
  var LANGS = {
    zh: {
      title: 'DeepSeek Harness 管理台',
      sub: '管理员变体镜像 · 在此选择/切换 DSH 版本、配置 npm 源并管理 DSH 进程',
      stTitle: '运行状态', stChecking: '检测中',
      stLabelCur: '当前版本', stLabelTime: '安装时间', stLabelRun: '运行状态', stLabelUi: 'DSH 界面', stOpenUi: '打开 DSH 界面 ↗',
      btnRestart: '重启 DSH', btnRefresh: '刷新状态',
      regTitle: 'npm 源（NPM_CONFIG_REGISTRY）', regPlaceholder: '加载中...', btnRegUseDef: '使用默认值', btnRegSave: '保存',
      regHintLoading: '加载中...',
      verTitle: 'DSH 版本', verLoading: '加载版本列表中...', btnInstall: '安装 / 切换版本', btnRefreshVer: '刷新列表', verHint: '安装或切换后会自动启动 DSH。',
      terminalTitle: '容器终端', terminalConnecting: '连接中', terminalConnected: '已连接', terminalDisconnected: '未连接', terminalError: '连接错误',
      terminalCwd: '工作目录', terminalConnect: '连接', terminalDisconnect: '断开', terminalClear: '清空', terminalRun: '执行',
      terminalPlaceholder: '输入命令并按 Enter 执行', terminalHint: '命令将在容器内以当前用户执行。', terminalExit: 'shell 已退出',
      logTitle: '安装日志（实时）', btnClearLog: '清空',
      badgeInstalling: '安装中', badgeRunning: '运行中', badgeNotRun: '未运行', badgeNotInstalled: '未安装',
      stSelectedPrefix: '已选 ', runYes: '运行中', runNo: '已停止',
      allVersions: '全部版本', noVersions: '（无可用版本）',
      errTag: '[错误]', warnTag: '[警告]',
      logConnecting: '连接管理服务...',
      regHintDefault: '默认值：', regHintLast: ' ｜ 上次配置：', regHintEff: ' ｜ 当前生效：',
      regHintPriority: '优先级：页面配置 > 环境变量 NPM_CONFIG_REGISTRY > 默认值。',
      regHintNote: '保存后仅对后续安装/版本列表生效，不会改动已安装的 DSH。',
      regSaved: '已保存 npm 源：{v}', useDefaultLabel: '（使用默认值）', errSave: '[错误] 保存失败: {e}',
      warnVersions: '[警告] 获取版本列表失败: {e}',
      logRefreshStart: '刷新版本列表...', logRefreshDone: '版本列表已刷新（{n} 个版本）',
      warnSelectFirst: '[警告] 请先选择版本', logInstallSubmit: '已提交安装任务：{v}（实时日志见下方）',
      errRefresh: '[错误] 刷新状态失败: {e}',
      restartDone: 'DSH 已重启', restartFail: '重启失败: {r}',
      sseStart: '开始安装 DSH {v} ...', sseDone: '安装完成，当前版本：{v}', sseDoneFail: '安装失败',
      sseBootOk: 'DSH 已启动', sseBootFail: 'DSH 启动失败: {r}'
    },
    en: {
      title: 'DeepSeek Harness Admin',
      sub: 'Admin variant image · Select/switch DSH version, configure npm registry and manage DSH process',
      stTitle: 'Runtime Status', stChecking: 'Checking',
      stLabelCur: 'Current version', stLabelTime: 'Installed at', stLabelRun: 'Status', stLabelUi: 'DSH UI', stOpenUi: 'Open DSH UI ↗',
      btnRestart: 'Restart DSH', btnRefresh: 'Refresh',
      regTitle: 'npm registry (NPM_CONFIG_REGISTRY)', regPlaceholder: 'Loading...', btnRegUseDef: 'Use default', btnRegSave: 'Save',
      regHintLoading: 'Loading...',
      verTitle: 'DSH Version', verLoading: 'Loading versions...', btnInstall: 'Install / Switch', btnRefreshVer: 'Refresh list', verHint: 'DSH will start automatically after install or switch.',
      terminalTitle: 'Container terminal', terminalConnecting: 'Connecting', terminalConnected: 'Connected', terminalDisconnected: 'Disconnected', terminalError: 'Connection error',
      terminalCwd: 'Working directory', terminalConnect: 'Connect', terminalDisconnect: 'Disconnect', terminalClear: 'Clear', terminalRun: 'Run',
      terminalPlaceholder: 'Enter a command and press Enter', terminalHint: 'Commands run inside the container as the current user.', terminalExit: 'Shell exited',
      logTitle: 'Install log (live)', btnClearLog: 'Clear',
      badgeInstalling: 'Installing', badgeRunning: 'Running', badgeNotRun: 'Not running', badgeNotInstalled: 'Not installed',
      stSelectedPrefix: 'Selected ', runYes: 'Running', runNo: 'Stopped',
      allVersions: 'All versions', noVersions: '(no available versions)',
      errTag: '[Error]', warnTag: '[Warning]',
      logConnecting: 'Connecting to management service...',
      regHintDefault: 'Default: ', regHintLast: ' ｜ Last saved: ', regHintEff: ' ｜ Effective: ',
      regHintPriority: 'Priority: page config > env var NPM_CONFIG_REGISTRY > default.',
      regHintNote: 'Saving only affects future installs/version list; installed DSH is not modified.',
      regSaved: 'npm registry saved: {v}', useDefaultLabel: '(using default)', errSave: '[Error] Save failed: {e}',
      warnVersions: '[Warning] Failed to load version list: {e}',
      logRefreshStart: 'Refreshing version list...', logRefreshDone: 'Version list refreshed ({n} versions)',
      warnSelectFirst: '[Warning] Please select a version first', logInstallSubmit: 'Install task submitted: {v} (see live log below)',
      errRefresh: '[Error] Failed to refresh status: {e}',
      restartDone: 'DSH restarted', restartFail: 'Restart failed: {r}',
      sseStart: 'Start installing DSH {v} ...', sseDone: 'Install complete, current version: {v}', sseDoneFail: 'Install failed',
      sseBootOk: 'DSH started', sseBootFail: 'DSH failed to start: {r}'
    }
  };

  var T = LANGS.zh;
  var lang = 'zh';
  var lastState = null;

  function t(key, params){
    var s = (T && T[key] != null) ? T[key] : (LANGS.zh[key] != null ? LANGS.zh[key] : key);
    if (params) {
      Object.keys(params).forEach(function(k){
        s = s.split('{' + k + '}').join(params[k]);
      });
    }
    return s;
  }

  // ── 容器终端组件 ────────────────────────────────────────────
  // 使用 light DOM 让现有页面主题和语言切换逻辑可以直接作用于组件内容。
  if (window.customElements && !window.customElements.get('container-terminal')) {
    class ContainerTerminal extends HTMLElement {
      constructor(){
        super();
        this.ws = null;
        this.pendingInput = [];
        this.resizeObserver = null;
        this.resizeHandler = null;
        this.statusKey = 'terminalConnecting';
        this.statusClass = 'warn';
        this.statusText = null;
      }
      connectedCallback(){
        this.innerHTML = `
          <div class="terminal-panel">
            <div class="terminal-toolbar">
              <span class="terminal-cwd-label" data-i18n="terminalCwd">工作目录</span>
              <code class="terminal-cwd" data-terminal-cwd title=""></code>
              <button type="button" class="ghost" data-terminal-connect data-i18n="terminalConnect" title="">连接</button>
              <button type="button" class="ghost" data-terminal-clear data-i18n="terminalClear" title="">清空</button>
            </div>
            <pre class="terminal-output" data-terminal-output role="log" aria-live="polite" tabindex="0"></pre>
            <div class="terminal-input-row">
              <span class="terminal-prompt" aria-hidden="true">$</span>
              <input class="terminal-input" data-terminal-input type="text" autocomplete="off" autocapitalize="off" spellcheck="false" data-i18n-ph="terminalPlaceholder">
              <button type="button" data-terminal-run data-i18n="terminalRun" title="">执行</button>
            </div>
            <div class="hint terminal-hint" data-i18n="terminalHint">命令将在容器内以当前用户执行。</div>
          </div>`;
        this.status = document.getElementById('terminalStatus');
        this.cwd = this.querySelector('[data-terminal-cwd]');
        this.output = this.querySelector('[data-terminal-output]');
        this.input = this.querySelector('[data-terminal-input]');
        this.connectButton = this.querySelector('[data-terminal-connect]');
        this.clearButton = this.querySelector('[data-terminal-clear]');
        this.runButton = this.querySelector('[data-terminal-run]');
        this.connectButton.addEventListener('click', () => {
          if (this.ws && (this.ws.readyState === WebSocket.OPEN || this.ws.readyState === WebSocket.CONNECTING)) this.disconnect();
          else this.connect();
        });
        this.clearButton.addEventListener('click', () => this.clearOutput());
        this.runButton.addEventListener('click', () => this.runCommand());
        this.input.addEventListener('keydown', (ev) => this.handleKey(ev));
        this.output.addEventListener('click', () => this.input.focus());
        if (window.ResizeObserver) {
          this.resizeObserver = new ResizeObserver(() => this.sendResize());
          this.resizeObserver.observe(this.output);
        } else {
          this.resizeHandler = () => this.sendResize();
          window.addEventListener('resize', this.resizeHandler);
        }
        this.setLanguage();
        this.connect();
      }
      disconnectedCallback(){
        this.disconnect();
        if (this.resizeObserver) this.resizeObserver.disconnect();
        if (this.resizeHandler) window.removeEventListener('resize', this.resizeHandler);
      }
      setLanguage(){
        this.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(el.getAttribute('data-i18n')); });
        this.querySelectorAll('[data-i18n-ph]').forEach((el) => { el.placeholder = t(el.getAttribute('data-i18n-ph')); });
        this.updateControls();
        if (this.status && this.statusText === null) {
          this.status.textContent = t(this.statusKey);
          this.status.className = 'badge ' + this.statusClass;
        }
      }
      setStatus(key, cls, text){
        this.statusKey = key;
        this.statusClass = cls || 'warn';
        this.statusText = text == null ? null : String(text);
        if (!this.status) return;
        this.status.textContent = this.statusText === null ? t(key) : this.statusText;
        this.status.className = 'badge ' + this.statusClass;
      }
      updateControls(){
        if (!this.connectButton) return;
        var open = this.ws && this.ws.readyState === WebSocket.OPEN;
        var connecting = this.ws && this.ws.readyState === WebSocket.CONNECTING;
        this.connectButton.textContent = open ? t('terminalDisconnect') : t('terminalConnect');
        this.connectButton.disabled = !!connecting;
        this.connectButton.title = open ? t('terminalDisconnect') : t('terminalConnect');
        this.clearButton.title = t('terminalClear');
        this.runButton.title = t('terminalRun');
      }
      connect(){
        if (this.ws && (this.ws.readyState === WebSocket.OPEN || this.ws.readyState === WebSocket.CONNECTING)) return;
        this.statusText = null;
        this.setStatus('terminalConnecting', 'warn');
        var scheme = location.protocol === 'https:' ? 'wss://' : 'ws://';
        var ws;
        try { ws = new WebSocket(scheme + location.host + '/__admin/api/terminal'); }
        catch(e){
          this.setStatus('terminalError', 'err', t('terminalError'));
          this.appendOutput('\n[terminal] ' + e.message + '\n');
          return;
        }
        this.ws = ws;
        this.updateControls();
        ws.addEventListener('open', () => {
          if (this.ws !== ws) return;
          this.setStatus('terminalConnected', 'ok');
          this.updateControls();
          this.sendResize();
          this.flushPendingInput();
          this.input.focus();
        });
        ws.addEventListener('message', (ev) => {
          if (this.ws !== ws) return;
          this.handleMessage(ev.data);
        });
        ws.addEventListener('error', () => {
          if (this.ws !== ws) return;
          this.setStatus('terminalError', 'err');
          this.appendOutput('\n[terminal] ' + t('terminalError') + '\n');
        });
        ws.addEventListener('close', () => {
          if (this.ws !== ws) return;
          this.ws = null;
          this.pendingInput = [];
          this.setStatus('terminalDisconnected', 'warn');
          this.updateControls();
        });
      }
      disconnect(){
        var ws = this.ws;
        if (!ws) return;
        this.ws = null;
        this.pendingInput = [];
        try {
          if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'close' }));
          ws.close();
        } catch(e){}
        this.setStatus('terminalDisconnected', 'warn');
        this.updateControls();
      }
      handleMessage(raw){
        var message;
        try { message = JSON.parse(typeof raw === 'string' ? raw : String(raw)); }
        catch(e){ return this.appendOutput(String(raw)); }
        if (!message || typeof message !== 'object') return;
        if (message.type === 'ready') {
          this.cwd.textContent = message.cwd || '-';
          this.cwd.title = message.cwd || '';
          return;
        }
        if (message.type === 'output') return this.appendOutput(message.data || '');
        if (message.type === 'error') {
          this.appendOutput('\n[terminal] ' + (message.message || t('terminalError')) + '\n');
          return this.setStatus('terminalError', 'err');
        }
        if (message.type === 'exit') {
          this.appendOutput('\n[' + t('terminalExit') + ']\n');
          this.setStatus('terminalDisconnected', 'warn');
        }
      }
      send(data){
        if (!this.ws || this.ws.readyState === WebSocket.CONNECTING) {
          this.pendingInput.push(String(data));
          if (!this.ws) this.connect();
          return true;
        }
        if (this.ws.readyState !== WebSocket.OPEN) {
          this.connect();
          return false;
        }
        try {
          this.ws.send(JSON.stringify({ type: 'input', data: data }));
          return true;
        } catch(e){
          this.setStatus('terminalError', 'err');
          return false;
        }
      }
      flushPendingInput(){
        if (!this.ws || this.ws.readyState !== WebSocket.OPEN || !this.pendingInput.length) return;
        var pending = this.pendingInput.splice(0);
        pending.forEach((data) => this.send(data));
      }
      sendResize(){
        if (!this.ws || this.ws.readyState !== WebSocket.OPEN || !this.output) return;
        var width = Math.max(240, this.output.clientWidth || 960);
        var height = Math.max(120, this.output.clientHeight || 320);
        var cols = Math.max(20, Math.min(300, Math.floor(width / 8)));
        var rows = Math.max(5, Math.min(100, Math.floor(height / 20)));
        try { this.ws.send(JSON.stringify({ type: 'resize', cols: cols, rows: rows })); } catch(e){}
      }
      runCommand(){
        var value = this.input.value;
        if (!value) return this.input.focus();
        if (this.send(value + '\n')) this.input.value = '';
        this.input.focus();
      }
      handleKey(ev){
        var key = ev.key;
        if (key === 'Enter') { ev.preventDefault(); return this.runCommand(); }
        if (ev.ctrlKey && key.toLowerCase() === 'c') {
          ev.preventDefault(); this.input.value = ''; return this.send('\u0003');
        }
        if (ev.ctrlKey && key.toLowerCase() === 'd') {
          ev.preventDefault(); return this.send('\u0004');
        }
        if (ev.ctrlKey && key.toLowerCase() === 'l') {
          ev.preventDefault(); return this.clearOutput();
        }
        var sequences = { ArrowUp: '\u001b[A', ArrowDown: '\u001b[B', ArrowRight: '\u001b[C', ArrowLeft: '\u001b[D', Home: '\u001b[H', End: '\u001b[F', Tab: '\t' };
        if (sequences[key] && !ev.altKey && !ev.metaKey) {
          ev.preventDefault();
          return this.send(sequences[key]);
        }
      }
      appendOutput(data){
        if (!this.output || data == null) return;
        var clean = String(data)
          .replace(/\x1b\][^\x07]*(?:\x07|\x1b\\)/g, '')
          .replace(/\x1b\[[0-?]*[ -\/]*[@-~]/g, '');
        this.output.textContent += clean;
        if (this.output.textContent.length > 200000) this.output.textContent = this.output.textContent.slice(-160000);
        this.output.scrollTop = this.output.scrollHeight;
      }
      clearOutput(){ if (this.output) this.output.textContent = ''; this.input && this.input.focus(); }
    }
    customElements.define('container-terminal', ContainerTerminal);
  }

  function applyLang(l){
    lang = (l === 'en') ? 'en' : 'zh';
    T = LANGS[lang];
    try { localStorage.setItem('dshLang', lang); } catch(e){}
    document.documentElement.lang = lang;
    document.title = t('title');
    $('btnLang').textContent = lang === 'zh' ? 'EN' : '中文';
    $('btnLang').title = lang === 'zh' ? 'Switch to English' : '切换到中文';
    var els = document.querySelectorAll('[data-i18n]');
    for (var i = 0; i < els.length; i++) els[i].textContent = t(els[i].getAttribute('data-i18n'));
    var phs = document.querySelectorAll('[data-i18n-ph]');
    for (var j = 0; j < phs.length; j++) phs[j].placeholder = t(phs[j].getAttribute('data-i18n-ph'));
    var terminal = $('containerTerminal');
    if (terminal && typeof terminal.setLanguage === 'function') terminal.setLanguage();
    if (lastState) renderState(lastState);
  }
  $('btnLang').addEventListener('click', function(){ applyLang(lang === 'zh' ? 'en' : 'zh'); });

  // 语言初始化（需在首次输出日志前执行）
  var initLang = 'zh';
  try {
    var saved = localStorage.getItem('dshLang');
    if (saved === 'en' || saved === 'zh') initLang = saved;
    else if ((navigator.language || 'en').toLowerCase().indexOf('zh') >= 0) initLang = 'zh';
    else initLang = 'en';
  } catch(e){}
  applyLang(initLang);

  // ── 工具函数 ────────────────────────────────────────────────
  var log = function(line, cls){
    var el = $('log');
    var d = document.createElement('div');
    if (cls) d.className = cls;
    d.textContent = line;
    el.appendChild(d);
    el.scrollTop = el.scrollHeight;
  };
  log(t('logConnecting'));

  // ── registry 配置 ─────────────────────────────────────────
  var lastRegistry = null;
  function renderRegistry(r){
    if (!r) return;
    var input = $('regInput');
    input.placeholder = r.default || '';
    input.value = r.saved || '';
    $('regHint').innerHTML =
      t('regHintDefault') + '<code>' + (r.default||'') + '</code>' +
      (r.saved ? t('regHintLast') + '<code>' + r.saved + '</code>' : '') +
      t('regHintEff') + '<code>' + (r.effective||'') + '</code>' +
      ' ｜ ' + t('regHintPriority') + ' ' + t('regHintNote');
    lastRegistry = r;
  }
  $('btnRegUseDef').addEventListener('click', function(){
    var r = lastRegistry;
    if (r && r.default) $('regInput').value = r.default;
  });
  $('btnRegSave').addEventListener('click', async function(){
    var v = $('regInput').value.trim();
    try {
      var res = await fetch('/__admin/api/registry', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ registry: v })
      });
      var j = await res.json();
      if (!res.ok || !j.ok) { log(t('errSave', { e: (j.error||res.status) }), 'err'); return; }
      renderRegistry(j.registry);
      log(t('regSaved', { v: v || t('useDefaultLabel') }));
    } catch(e){ log(t('errSave', { e: e.message }), 'err'); }
  });

  // ── 版本列表 ──────────────────────────────────────────────
  var ALL_VERSIONS = [];
  function renderVersions(v){
    var sel = $('verSelect');
    sel.innerHTML = '';
    if (v.error) log(t('warnVersions', { e: v.error }), 'err');
    var tags = v.distTags || {};
    var list = v.list || [];
    // 标签优先展示
    var seen = {};
    Object.keys(tags).forEach(function(k){
      if (seen[tags[k]]) return; seen[tags[k]] = 1;
      var o = document.createElement('option');
      o.value = tags[k]; o.textContent = k + (lang === 'zh' ? '（' + tags[k] + '）' : ' (' + tags[k] + ')');
      sel.appendChild(o);
    });
    if (list.length) {
      var og = document.createElement('optgroup');
      og.label = t('allVersions');
      list.slice().reverse().forEach(function(x){
        if (seen[x]) return; seen[x] = 1;
        var o = document.createElement('option');
        o.value = x; o.textContent = x;
        og.appendChild(o);
      });
      sel.appendChild(og);
    }
    if (!sel.options.length) {
      var o = document.createElement('option');
      o.value = ''; o.textContent = t('noVersions');
      sel.appendChild(o);
    }
    // 默认选中当前安装版本
    var cur = ALL_VERSIONS.__cur;
    if (cur) { sel.value = cur; }
  }
  $('btnRefreshVer').addEventListener('click', function(){
    log(t('logRefreshStart'));
    fetch('/__admin/api/versions?refresh=1').then(r=>r.json()).then(function(j){
      renderVersions(j); log(t('logRefreshDone', { n: (j.list||[]).length }));
    }).catch(function(e){ log(t('errTag') + ' ' + e.message, 'err'); });
  });
  $('btnInstall').addEventListener('click', async function(){
    var v = $('verSelect').value;
    if (!v) { log(t('warnSelectFirst'), 'err'); return; }
    $('btnInstall').disabled = true;
    try {
      var res = await fetch('/__admin/api/install', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ version: v })
      });
      var j = await res.json();
      if (res.status === 409) { log(t('errTag') + ' ' + j.error, 'err'); return; }
      log(t('logInstallSubmit', { v: v }));
    } catch(e){ log(t('errTag') + ' ' + e.message, 'err'); }
    finally { $('btnInstall').disabled = false; }
  });

  // ── 状态刷新 ──────────────────────────────────────────────
  function renderState(s){
    if (!s) return;
    lastState = s;
    var running = !!s.running;
    var badge = $('stBadge');
    var bk = (s.install && s.install.running) ? 'badgeInstalling' : (running ? 'badgeRunning' : (s.installed ? 'badgeNotRun' : 'badgeNotInstalled'));
    var bcl = (s.install && s.install.running) ? 'act' : (running ? 'ok' : (s.installed ? 'warn' : 'err'));
    badge.textContent = t(bk); badge.className = 'badge ' + bcl;

    $('stActual').textContent = s.actual || '-';
    var req = $('stRequested');
    if (s.requested && s.requested !== s.actual) req.textContent = t('stSelectedPrefix') + s.requested;
    else req.textContent = '';
    $('stInstalledAt').textContent = s.installedAt ? new Date(s.installedAt).toLocaleString() : '-';
    $('stRunning').textContent = running ? t('runYes') : t('runNo');
    $('linkDash').style.display = running ? '' : 'none';

    renderRegistry(s.registry);
    if (!ALL_VERSIONS.__cur && s.actual) ALL_VERSIONS.__cur = s.actual;
    if ((s.versions && s.versions.list) || (s.versions && s.versions.distTags)) {
      renderVersions(s.versions);
    }
  }
  function refresh(){
    fetch('/__admin/api/state').then(function(r){ return r.json(); }).then(renderState)
      .catch(function(e){ log(t('errRefresh', { e: e.message }), 'err'); });
  }
  $('btnRefresh').addEventListener('click', refresh);
  $('btnRestart').addEventListener('click', async function(){
    $('btnRestart').disabled = true;
    try {
      var j = await (await fetch('/__admin/api/restart', {method:'POST'})).json();
      log(j.ok ? t('restartDone') : t('errTag') + ' ' + t('restartFail', { r: (j.reason||'') }), j.ok?'':'err');
    } catch(e){ log(t('errTag') + ' ' + e.message, 'err'); }
    finally { $('btnRestart').disabled = false; }
  });
  $('btnClearLog').addEventListener('click', function(){ $('log').innerHTML=''; });

  // ── SSE 实时日志 ──────────────────────────────────────────
  if (window.EventSource) {
    var es = new EventSource('/__admin/api/events');
    es.addEventListener('start', function(ev){ var d=JSON.parse(ev.data); log(t('sseStart', { v: d.version })); });
    es.addEventListener('log', function(ev){ var d=JSON.parse(ev.data); log(d.line, /错误|ERR/i.test(d.line)?'err':''); });
    es.addEventListener('done', function(ev){
      var d=JSON.parse(ev.data);
      log(d.ok ? t('sseDone', { v: d.version }) : t('errTag') + ' ' + t('sseDoneFail'), d.ok?'':'err');
      refresh();
    });
    es.addEventListener('boot', function(ev){
      var d=JSON.parse(ev.data);
      log(d.ok ? t('sseBootOk') : t('errTag') + ' ' + t('sseBootFail', { r: d.reason }), d.ok?'':'err');
      refresh();
    });
    es.onerror = function(){ /* 连接断开自动重连 */ };
  }

  // 初始加载
  refresh();
})();
</script>
</body>
</html>
